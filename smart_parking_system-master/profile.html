<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="./profile.css">
</head>
<body>
    <div class="profile-container">
        <h2>My Profile</h2>
        <form id="profileForm">
            <label for="profilePicture">Profile Picture:</label>
            <input type="file" id="profilePicture">
            <img id="previewImage" src="../images/default-profile.png" alt="Profile Picture">

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email"> 

            <label for="phone">Phone:</label>
            <input type="text" id="phone" placeholder="Enter your phone number">

            <button type="submit">Save Changes</button>
        </form>

        <div id="profile-summary" class="profile-card">
            <h3>Saved Profile</h3>
            <p><strong>Name:</strong> <span id="card-name"></span></p>
            <p><strong>Email:</strong> <span id="card-email"></span></p>
            <p><strong>Phone:</strong> <span id="card-phone"></span></p>
            <p><strong>Picture:</strong></p>
            <img id="card-image" src="../images/default-profile.png" alt="Profile Picture">
        </div>
    </div>

    <script src="./profile.js"></script>
</body>
</html>
